<h3 class="text-center">Task List</h3>

<select [(ngModel)]="filter">
  <option>All</option>
  <option>Completed</option>
  <option>Pending</option>
</select>

<div class="border border-2 rounded-2 p-2 m-2">
  @for (task of getFilteredTasks(); track $index) {
    <div>
      <span><input type="checkbox" [(ngModel)]="task.completed"></span>
      <span class="mx-5">{{task.id}}</span>
      <span class="mx-5" [style.text-decoration]="task.completed?'line-through':'none'">
        {{task.title}}
      </span>
      <span>{{task.completed}}</span>
    </div>
  }
</div>
<div>{{completedCount()}} out of {{tasks.length}} tasks are completed </div>
