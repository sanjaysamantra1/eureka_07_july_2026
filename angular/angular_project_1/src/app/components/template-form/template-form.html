<h3 class="text-center">Template Form</h3>

<div class="col-sm-6 offset-3 border border-3 rounded-3 p-3">
  <form #myForm="ngForm" (submit)="submitMyForm(myForm.value)">
    <p>FirstName: <input name="firstName" ngModel /></p>
    <p>lastName: <input name="lastName" ngModel /></p>
    <p>email: <input name="email" ngModel /></p>

    <div ngModelGroup="address">
      <p>street: <input name="street" ngModel /></p>
      <p>city: <input name="city" ngModel /></p>
      <p>pincode: <input name="pincode" ngModel /></p>
    </div>

    <button type="reset" class="btn btn-danger mx-2">Reset</button>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
  <hr/>
  <pre>{{myForm.value | json}}</pre>
</div>
